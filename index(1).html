<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Library Management System</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f4f6f8; color: #222; }
    header {
        background: #2c3e50; color: white; padding: 20px;
        text-align: center;
    }
    header h1 { margin-bottom: 6px; }
    .container { width: 92%; max-width: 1100px; margin: 25px auto; }
    .stats {
        display: grid; grid-template-columns: repeat(3, 1fr);
        gap: 15px; margin-bottom: 20px;
    }
    .card {
        background: white; padding: 20px; border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08); text-align: center;
    }
    .card h2 { color: #3498db; margin-top: 8px; }
    .form-box, .table-box {
        background: white; padding: 20px; border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 20px;
    }
    .form-box h2, .table-box h2 { margin-bottom: 15px; color: #2c3e50; }
    form {
        display: grid; grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }
    input, button {
        padding: 11px; border-radius: 6px; border: 1px solid #ccc;
        font-size: 15px;
    }
    button { border: none; cursor: pointer; color: white; background: #3498db; }
    button:hover { opacity: .9; }
    .add-btn { background: #27ae60; }
    .delete-btn { background: #e74c3c; padding: 8px 12px; }
    .issue-btn { background: #f39c12; padding: 8px 12px; }
    .return-btn { background: #8e44ad; padding: 8px 12px; }
    .search { width: 100%; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #ecf0f1; }
    .available { color: #27ae60; font-weight: bold; }
    .issued { color: #e67e22; font-weight: bold; }
    .actions button { margin: 2px; }
    @media(max-width: 750px) {
        .stats, form { grid-template-columns: 1fr; }
        .table-box { overflow-x: auto; }
        table { min-width: 750px; }
    }
</style>
</head>
<body>

<header>
    <h1>📚 Online Library Management System</h1>
    <p>Manage books easily and efficiently</p>
</header>

<div class="container">

    <div class="stats">
        <div class="card">
            <p>Total Books</p>
            <h2 id="totalBooks">0</h2>
        </div>
        <div class="card">
            <p>Available Books</p>
            <h2 id="availableBooks">0</h2>
        </div>
        <div class="card">
            <p>Issued Books</p>
            <h2 id="issuedBooks">0</h2>
        </div>
    </div>

    <div class="form-box">
        <h2>➕ Add New Book</h2>
        <form id="bookForm">
            <input type="text" id="bookName" placeholder="Book Name" required>
            <input type="text" id="author" placeholder="Author Name" required>
            <input type="text" id="category" placeholder="Category" required>
            <button type="submit" class="add-btn">Add Book</button>
        </form>
    </div>

    <div class="table-box">
        <h2>📖 Library Books</h2>
        <input type="text" id="search" class="search" placeholder="🔍 Search by book, author or category...">

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="bookTable"></tbody>
        </table>
    </div>

</div>

<script>
let books = JSON.parse(localStorage.getItem("libraryBooks")) || [
    {id: 1, name: "Java Programming", author: "Herbert Schildt", category: "Programming", status: "Available"},
    {id: 2, name: "Python Basics", author: "Mark Lutz", category: "Programming", status: "Available"},
    {id: 3, name: "Operating System", author: "Galvin", category: "Computer", status: "Issued"}
];

const form = document.getElementById("bookForm");
const table = document.getElementById("bookTable");
const search = document.getElementById("search");

function saveBooks() {
    localStorage.setItem("libraryBooks", JSON.stringify(books));
}

function displayBooks(list = books) {
    table.innerHTML = "";

    if (list.length === 0) {
        table.innerHTML = `<tr><td colspan="6" style="text-align:center;">No books found</td></tr>`;
        updateStats();
        return;
    }

    list.forEach(book => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${book.id}</td>
            <td>${escapeHTML(book.name)}</td>
            <td>${escapeHTML(book.author)}</td>
            <td>${escapeHTML(book.category)}</td>
            <td class="${book.status === "Available" ? "available" : "issued"}">
                ${book.status}
            </td>
            <td class="actions">
                ${
                    book.status === "Available"
                    ? `<button class="issue-btn" onclick="changeStatus(${book.id})">Issue</button>`
                    : `<button class="return-btn" onclick="changeStatus(${book.id})">Return</button>`
                }
                <button class="delete-btn" onclick="deleteBook(${book.id})">Delete</button>
            </td>
        `;

        table.appendChild(row);
    });

    updateStats();
}

function updateStats() {
    document.getElementById("totalBooks").textContent = books.length;
    document.getElementById("availableBooks").textContent =
        books.filter(book => book.status === "Available").length;
    document.getElementById("issuedBooks").textContent =
        books.filter(book => book.status === "Issued").length;
}

form.addEventListener("submit", function(e) {
    e.preventDefault();

    const newBook = {
        id: books.length ? Math.max(...books.map(b => b.id)) + 1 : 1,
        name: document.getElementById("bookName").value.trim(),
        author: document.getElementById("author").value.trim(),
        category: document.getElementById("category").value.trim(),
        status: "Available"
    };

    books.push(newBook);
    saveBooks();
    displayBooks();

    form.reset();
    alert("Book added successfully!");
});

function changeStatus(id) {
    const book = books.find(b => b.id === id);
    if (book) {
        book.status = book.status === "Available" ? "Issued" : "Available";
        saveBooks();
        displayBooks();
    }
}

function deleteBook(id) {
    if (confirm("Are you sure you want to delete this book?")) {
        books = books.filter(book => book.id !== id);
        saveBooks();
        displayBooks();
    }
}

search.addEventListener("input", function() {
    const value = this.value.toLowerCase();

    const filtered = books.filter(book =>
        book.name.toLowerCase().includes(value) ||
        book.author.toLowerCase().includes(value) ||
        book.category.toLowerCase().includes(value)
    );

    displayBooks(filtered);
});

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

displayBooks();
</script>

</body>
</html>
